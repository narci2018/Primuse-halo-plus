name: Build Primuse iOS IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Primuse for iOS (Release)
        run: |
          xcodebuild build \
            -project Primuse.xcodeproj \
            -scheme Primuse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_derived \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_derived/Build/Products/Release-iphoneos -maxdepth 1 -name "Primuse.app")
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -9 Primuse-unsigned.ipa Payload
          ls -lh Primuse-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primuse-unsigned-ipa
          path: Primuse-unsigned.ipa
          retention-days: 14
