name: Build Primuse iOS IPA

on:
  push:
    paths:
      - "primuse/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          echo "=== All Available Xcodes ==="
          ls -ld /Applications/Xcode*.app || true

          SELECTED_XCODE=""
          for xcode in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            if [ -d "$xcode/Contents/Developer/Platforms/iPhoneOS.platform" ]; then
              echo "Found iOS platform in $xcode"
              SELECTED_XCODE="$xcode"
              break
            fi
          done

          if [ -n "$SELECTED_XCODE" ]; then
            echo "Selecting $SELECTED_XCODE"
            sudo xcode-select -s "$SELECTED_XCODE"
          fi

          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        working-directory: primuse
        run: |
          xcodegen generate

      - name: Build Primuse for iOS (Release)
        working-directory: primuse
        run: |
          xcodebuild build \
            -project Primuse.xcodeproj \
            -scheme Primuse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath build_derived \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -fexperimental-library -D_LIBCPP_ENABLE_EXPERIMENTAL' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        working-directory: primuse
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_derived/Build/Products/Release-iphoneos -maxdepth 1 -name "Primuse.app")
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -9 ../Primuse-unsigned.ipa Payload
          cd .. && ls -lh Primuse-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primuse-unsigned-ipa
          path: Primuse-unsigned.ipa
          retention-days: 14
