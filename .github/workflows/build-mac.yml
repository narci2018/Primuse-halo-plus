name: Build Primuse macOS DMG

# Two jobs, on purpose:
#
#   preflight — every push to main. A couple of minutes, and it answers "is the
#               tree still buildable": the vendored FFmpeg macOS slices must stay
#               symlinks, and XcodeGen must still emit a PrimuseMac scheme. That is
#               the guard against the Windows-import flattening which silently made
#               the Mac target unbuildable (see scripts/ci-check-ffmpeg-xcframework.sh).
#   build     — only for a version tag (v*) or a manual dispatch. The ~25 minute
#               compile + ad-hoc sign + DMG/ZIP, and on a tag it publishes the
#               DMG/ZIP onto that version's GitHub Release.
#
# Before this split a release produced two identical 25-minute builds, because
# pushing main and pushing the tag both matched one `push` trigger.

on:
  push:
    paths:
      - "primuse/**"
      - ".github/workflows/build-mac.yml"
      - "scripts/ci-check-ffmpeg-xcframework.sh"
  workflow_dispatch:
    inputs:
      thin_arch:
        description: "lipo -thin arm64 before signing (smaller DMG, fails if a slice is missing)"
        required: false
        default: "0"
      release_tag:
        description: "Also publish DMG/ZIP to this existing GitHub Release tag (empty = build only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (xcframework + project + scheme)
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode with macOS SDK
        run: |
          echo "=== Available Xcodes ==="
          ls -d /Applications/Xcode*.app || true
          SELECTED=""
          for xcode in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            if [ -d "$xcode/Contents/Developer/Platforms/MacOSX.platform" ]; then
              SELECTED="$xcode"
              break
            fi
          done
          if [ -n "$SELECTED" ]; then
            echo "Selecting $SELECTED"
            sudo xcode-select -s "$SELECTED"
          fi
          xcodebuild -version
          echo "=== Deployment target floor in project.yml ==="
          grep -A5 "deploymentTarget:" primuse/project.yml || true
          echo "=== MACOSX_DEPLOYMENT_TARGET resolution ==="
          grep -rn "MACOSX_DEPLOYMENT_TARGET" primuse/project.yml primuse/Config/*.xcconfig || true

      - name: Verify vendored FFmpeg xcframework is intact
        run: bash scripts/ci-check-ffmpeg-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: primuse
        run: xcodegen generate

      - name: Verify PrimuseMac scheme exists
        working-directory: primuse
        run: |
          xcodebuild -list -project Primuse.xcodeproj | sed -n '/Schemes:/,$p'
          xcodebuild -list -project Primuse.xcodeproj -json \
            | python3 -c "import sys,json; s=json.load(sys.stdin)['project']['schemes']; assert 'PrimuseMac' in s, f'PrimuseMac missing in {s}'; print('scheme OK:', s)"

  build:
    name: Build PrimuseMac (Apple Silicon)
    needs: preflight
    # A plain commit to main does not need a 25-minute Mac package; preflight
    # already says whether the tree is buildable. Build for releases, and on demand.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode with macOS SDK
        run: |
          SELECTED=""
          for xcode in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            if [ -d "$xcode/Contents/Developer/Platforms/MacOSX.platform" ]; then
              SELECTED="$xcode"
              break
            fi
          done
          if [ -n "$SELECTED" ]; then
            echo "Selecting $SELECTED"
            sudo xcode-select -s "$SELECTED"
          fi
          xcodebuild -version

      - name: Verify vendored FFmpeg xcframework is intact
        # Repeated from preflight on purpose: this job must stay runnable on its
        # own, and the check costs seconds against a 25-minute wasted build.
        run: bash scripts/ci-check-ffmpeg-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: primuse
        run: xcodegen generate

      - name: Build PrimuseMac (Release, arm64)
        working-directory: primuse
        run: |
          set -o pipefail
          # "generic/platform=macOS,arch=arm64" is rejected outright:
          # xcodebuild exits 70 with "Unable to find a device matching the
          # provided destination specifier" because a generic destination must
          # not carry an arch. Pin arm64 through the ARCHS build setting
          # instead, which is also what keeps the DMG Apple-Silicon-only.
          xcodebuild build \
            -project Primuse.xcodeproj \
            -scheme PrimuseMac \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -sdk macosx \
            -derivedDataPath build_derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -fexperimental-library -D_LIBCPP_ENABLE_EXPERIMENTAL' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee mac-build.log

      - name: Surface build errors as annotations + summary
        if: failure()
        working-directory: primuse
        run: |
          # Artifacts and raw logs need an authenticated GET. Check-run annotations
          # and the job summary are readable anonymously on a public repo, so the
          # first compiler errors are mirrored into both. Capped because each
          # annotation is its own row on the run page.
          LOG=mac-build.log
          [ -f "$LOG" ] || { echo "::error::no mac-build.log produced"; exit 0; }
          echo "=== log size: $(wc -c < "$LOG") bytes, $(wc -l < "$LOG") lines ==="
          # Every grep below can legitimately find nothing; Actions runs bash with
          # -e -o pipefail, so an unmatched grep would abort the step before the
          # summary is written. Hence the explicit "|| true".
          # -A4 because xcodebuild puts the useful part (the list of valid
          # destinations, the failing command, the file/line) *under* the line
          # that matches "error:".
          EXTRACT() {
            grep -E -A4 "error:|fatal error|The following build commands failed|^Command .* failed" "$LOG" \
              | sed -E 's|/Users/runner/work/[^ ]*/||' | head -120 || true
          }
          {
            echo "## Build log errors"
            echo '```'
            EXTRACT
            echo '```'
            echo
            echo "<details><summary>last 60 lines</summary>"
            echo
            echo '```'
            tail -60 "$LOG"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          EXTRACT | head -40 | while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '::error::%s\n' "$(printf '%.2000s' "$line")"
          done || true
          exit 1

      - name: Resolve version for artifact name
        id: ver
        working-directory: primuse
        run: |
          MV=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          CV=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "marketing=$MV build=$CV"
          echo "name=Primuse-macos-arm64-${MV}-b${CV}" >> "$GITHUB_OUTPUT"

      - name: Package ad-hoc-signed DMG and ZIP
        working-directory: primuse
        env:
          # Ad-hoc by default: no Apple Developer account is configured for this
          # fork, and Apple Silicon refuses to exec an entirely unsigned binary.
          PRIMUSE_MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY != '' && secrets.MAC_SIGN_IDENTITY || '-' }}
          PRIMUSE_MAC_ENTITLEMENTS: ${{ secrets.MAC_SIGN_IDENTITY != '' && 'Config/PrimuseMac.entitlements' || '' }}
          PRIMUSE_MAC_PROVISIONING: ""
          PRIMUSE_MAC_NOTARIZE: "0"
        run: |
          chmod +x scripts/package-mac-dmg.sh
          APP=$(find build_derived/Build/Products -maxdepth 2 -name "Primuse.app" -type d | head -1 || true)
          if [ -z "$APP" ]; then
            echo "No Primuse.app produced — build failed earlier; see mac-build.log" >&2
            find build_derived/Build/Products -maxdepth 2 || true
            exit 1
          fi
          echo "Packaging: $APP"
          if [ "${{ inputs.thin_arch || '0' }}" = "1" ]; then
            # ARCHS=arm64 already makes everything Xcode compiles arm64-only; the
            # fat parts are the vendored FFmpeg slices, whose mac frameworks are
            # universal (arm64 + x86_64). Those binaries live at
            # <fw>.framework/Versions/A/<fw> — a name glob over "*.dylib" never
            # reaches them, and the framework's top-level <fw> is a symlink, so
            # `find -type f` skips it. Name the four frameworks explicitly and
            # thin before signing, or the DMG ships ~30MB of dead x86_64.
            for f in libavutil libavcodec libavformat libswresample; do
              b=$(find "$APP/Contents/Frameworks" -path "*$f.framework/Versions/A/$f" -type f | head -1 || true)
              [ -n "$b" ] || continue
              lipo -thin arm64 -output "$b" "$b" && echo "thinned $f -> $(lipo -archs "$b")"
            done
            lipo -thin arm64 -output "$APP/Contents/MacOS/Primuse" "$APP/Contents/MacOS/Primuse" 2>/dev/null || true
            find "$APP/Contents" -type f -name '*.dylib' -exec sh -c 'lipo -thin arm64 -output "$1" "$1" 2>/dev/null || true' _ {} \;
          fi
          ./scripts/package-mac-dmg.sh "$APP" "${{ steps.ver.outputs.name }}"
          ls -lh "${{ steps.ver.outputs.name }}".*

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: |
            primuse/${{ steps.ver.outputs.name }}.dmg
            primuse/${{ steps.ver.outputs.name }}.zip
          retention-days: 14
          if-no-files-found: error

      # The iOS workflow attaches the IPA to the same tag; this attaches the Mac
      # package, so "push a tag" gives one Release page with both downloads.
      # Whichever job finishes first creates the Release, the other appends its file.
      #
      # A manual dispatch only publishes when release_tag is filled in: otherwise
      # github.ref_name is the branch, and the action would happily create a tag
      # and a Release named "main".
      - name: Publish DMG and ZIP to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          # append, not replace: the iOS job writes an auto-generated changelog into
          # the same release, and whichever job lands second must not erase it.
          append_body: true
          files: |
            primuse/${{ steps.ver.outputs.name }}.dmg
            primuse/${{ steps.ver.outputs.name }}.zip
          body: |
            ## macOS (Apple Silicon) — 未签名 / ad-hoc 签名

            `${{ steps.ver.outputs.name }}.dmg` 与 `.zip` 由 CI 以 ad-hoc 签名（`codesign -s -`，不含 entitlements，未公证）。
            装不上或打不开请先读 `docs/macos-install-unsigned.md`（Gatekeeper 放行步骤）。
            CloudKit 同步、桌面小组件、App Group 在这种分发形态下静默不可用。

      - name: Upload build log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: primuse-mac-build-log
          path: primuse/mac-build.log
          retention-days: 7
          if-no-files-found: ignore
