<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' http: https: data: blob:; media-src 'self' http://127.0.0.1:* blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;"
    />
    <title>Primuse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!--
        iPhone 版的结构（照 ContentView.swift:579-617 / MiniPlayerView / PlayerOverlay 抄）：
        一列内容 → tab 上方一条胶囊迷你播放器 → 底部四个 tab；全屏播放是覆盖层，不是路由。
        以前的 macOS 三栏（标题栏 + sidebar + detail）已经整块去掉了。
      -->
      <main class="screen" id="screen">
        <div class="loading">正在载入…</div>
      </main>

      <!-- 迷你播放器：ContentView.swift:2036-2053（胶囊、maxWidth 620、ultraThinMaterial） -->
      <div class="mini-wrap" id="mini-wrap" hidden>
        <div class="mini" id="mini" data-open-player="1">
          <span class="mini-cover" id="mini-cover"></span>
          <div class="mini-meta">
            <div class="mini-title" id="mini-title"></div>
            <div class="mini-artist" id="mini-artist"></div>
          </div>
          <button class="mini-btn" id="mini-play" title="播放 / 暂停"></button>
          <button class="mini-btn" id="mini-next" title="下一曲"></button>
        </div>
      </div>

      <!-- 多选批量条：SongBatchActionBar.swift —— 与迷你播放器互斥（原版批量态会隐藏迷你条） -->
      <div class="batch-wrap" id="batch-bar" hidden>
        <span class="batch-count" id="batch-count">已选择 0 首</span>
        <button class="batch-btn" data-batch="all">全选</button>
        <button class="batch-btn" data-batch="playlist">加入歌单</button>
        <button class="batch-btn" data-batch="next">下一首播放</button>
        <button class="batch-btn" data-batch="queue">加入播放队列</button>
        <button class="batch-btn" data-batch="remove">从歌单中移除</button>
        <button class="batch-x" data-batch="cancel" title="取消选择">✕</button>
      </div>

      <nav class="tabbar" id="tabbar">
        <button class="tab" data-tab="home"><span class="ico">home</span><span class="lab">首页</span></button>
        <button class="tab" data-tab="library"><span class="ico">library</span><span class="lab">资料库</span></button>
        <button class="tab" data-tab="search"><span class="ico">search</span><span class="lab">搜索</span></button>
        <button class="tab" data-tab="settings"><span class="ico">settings</span><span class="lab">设置</span></button>
      </nav>
    </div>

    <!-- 全屏播放浮层（PlayerOverlay：覆盖层 + 下拉/左缘滑动收起） -->
    <div class="player" id="player" hidden>
      <div class="player-bg" id="player-bg"></div>
      <div class="player-inner">
        <div class="grabber" data-close-player="1"><span></span></div>
        <div class="player-err" id="player-err" hidden></div>

        <div class="art-area">
          <div class="art" id="art"></div>
        </div>

        <div class="meta-row">
          <div class="meta-text">
            <div class="meta-title" id="np-title">未在播放</div>
            <div class="meta-sub" id="np-artist"></div>
          </div>
          <button class="np-fav" id="np-fav" title="我喜欢"></button>
          <div class="menu np-menu">
            <button class="np-more" data-np-menu="1" title="更多"></button>
            <div class="menu-pop right" id="np-menu" hidden></div>
          </div>
        </div>

        <div class="progress" id="progress">
          <div class="track" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
          <div class="times"><span id="t-cur">0:00</span><span id="t-left">-0:00</span></div>
        </div>

        <div class="controls">
          <button class="ctrl mode" id="c-shuffle" title="随机播放"></button>
          <button class="ctrl" id="c-prev" title="上一曲"></button>
          <button class="ctrl big" id="c-play" title="播放 / 暂停"></button>
          <button class="ctrl" id="c-next" title="下一曲"></button>
          <button class="ctrl mode" id="c-repeat" title="单曲循环"></button>
        </div>

        <div class="volume-row">
          <span class="vol-ico lo"></span>
          <input id="c-volume" type="range" min="0" max="1" step="0.01" value="0.8" />
          <span class="vol-ico hi"></span>
        </div>

        <div class="slots">
          <button class="slot" data-toggle-view="lyrics" id="s-lyrics" title="歌词"></button>
          <button class="slot" data-open-device="1" id="s-device" title="播放设备"></button>
          <button class="slot" data-toggle-view="queue" id="s-queue" title="播放队列"></button>
        </div>
        <div class="format-row" id="np-format"></div>

        <div class="lyrics" id="lyrics" hidden></div>
      </div>

      <!-- 队列：原版是 sheet（detents medium/large），Windows 用底部抽屉 -->
      <div class="queue-sheet" id="queue-sheet" hidden>
        <div class="qs-head"><span>播放队列</span><button class="ghost" data-close-queue="1">完成</button></div>
        <div class="qs-body" id="qs-body"></div>
      </div>
    </div>

    <audio id="audio" preload="auto"></audio>
    <div id="toast" class="toast" hidden></div>

    <!-- sheet：添加到歌单 / 新建 / 重命名 / 重新排序 / 歌曲菜单 -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card">
        <div class="sheet-grabber"><span></span></div>
        <div class="sheet-head">
          <span id="sheet-title"></span>
          <button class="ghost" id="sheet-close">✕</button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
